<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404: Resource Scarce</title>
    <style>
        :root {
            --bg: #0f172a;
            --text: #e2e8f0;
            --accent: #ef4444;
            /* Scarcity Red */
            --highlight: #facc15;
            /* Gold */
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }

        .container {
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 8rem;
            margin: 0;
            line-height: 1;
            color: var(--bg);
            text-shadow:
                -1px -1px 0 var(--accent),
                1px -1px 0 var(--accent),
                -1px 1px 0 var(--accent),
                1px 1px 0 var(--accent);
            animation: glitch 2s infinite;
        }

        .badge {
            background: var(--highlight);
            color: #000;
            padding: 5px 15px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            transform: rotate(-2deg);
            display: inline-block;
            margin-bottom: 20px;
            box-shadow: 4px 4px 0 #fff;
        }

        p {
            font-size: 1.5rem;
            max-width: 600px;
            margin: 20px auto;
            line-height: 1.6;
            color: #94a3b8;
        }

        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 30px;
            background: transparent;
            color: var(--highlight);
            border: 2px solid var(--highlight);
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .btn:hover {
            background: var(--highlight);
            color: #000;
            box-shadow: 0 0 20px rgba(250, 204, 21, 0.4);
        }

        /* Econ Chart Background */
        .chart-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            opacity: 0.05;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        .line {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--accent);
            transform: rotate(-15deg);
            transform-origin: bottom left;
        }

        @keyframes glitch {
            0% {
                transform: translate(0);
            }

            20% {
                transform: translate(-2px, 2px);
            }

            40% {
                transform: translate(-2px, -2px);
            }

            60% {
                transform: translate(2px, 2px);
            }

            80% {
                transform: translate(2px, -2px);
            }

            100% {
                transform: translate(0);
            }
        }
    </style>
</head>

<body>

    <div class="chart-bg">
        <div class="line" style="bottom: 20%; transform: rotate(-10deg);"></div>
        <div class="line" style="bottom: 40%; transform: rotate(-20deg);"></div>
    </div>

    <div class="container">
        <div class="badge">Error: High Demand, Zero Supply</div>
        <h1>404</h1>
        <p>
            The resource you are looking for is currently <strong>unattainable</strong> given our current technology and
            resources.
        </p>
        <p style="font-size: 1rem; opacity: 0.7;">
            (Or maybe the page just doesn't exist. Probably that.)
        </p>

        <a href="/" class="btn">Return to Equilibrium</a>
    </div>

</body>

</html>
